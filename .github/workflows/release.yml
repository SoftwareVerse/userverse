name: CI - Release Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write  # push tags/commits & create releases

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # IMPORTANT: fetch full history & tags so we can diff and build notes
          fetch-depth: 0
          persist-credentials: true

      - name: Get Latest Tag
        id: get_tag
        run: |
          git fetch --tags --force
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          echo "Latest tag: ${latest_tag:-<none>}"
          echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Collect Release Commits
        id: release_commits
        run: |
          prev="${{ steps.get_tag.outputs.tag }}"
          if [ -n "$prev" ]; then
            range="${prev}..HEAD"
          else
            range="HEAD"
          fi

          git log $range --no-merges --pretty=format:'%s%x09%h%x09%an' > raw_release_commits.tsv
          awk -F '\t' '
            $1 != "style: auto-format code with Black" &&
            $1 !~ /^chore: bump version to v[0-9]+\.[0-9]+\.[0-9]+( \[skip ci\])?$/
          ' raw_release_commits.tsv > release_commits.tsv

          echo "Releaseable commits:"
          cat release_commits.tsv || true

          if [ -s release_commits.tsv ]; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine Version Bump
        id: version
        if: ${{ steps.release_commits.outputs.has_commits == 'true' }}
        run: |
          bump="patch"
          subjects=$(cut -f1 release_commits.tsv)
          if echo "$subjects" | grep -iqE '\[major\]'; then
            bump="major"
          elif echo "$subjects" | grep -iqE '\[minor\]'; then
            bump="minor"
          fi

          echo "Detected bump: $bump"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Calculate Next Version
        id: semver
        if: ${{ steps.release_commits.outputs.has_commits == 'true' }}
        run: |
          current=${{ steps.get_tag.outputs.tag }}
          # default when no tag exists
          if [ -z "$current" ]; then
            current="v0.1.0"
          fi

          IFS='.' read -r major minor patch <<<"${current#v}"
          bump=${{ steps.version.outputs.bump }}

          case "$bump" in
            major) new_version="$((major + 1)).0.0" ;;
            minor) new_version="$major.$((minor + 1)).0" ;;
            patch) new_version="$major.$minor.$((patch + 1))" ;;
          esac

          echo "current=$current"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes (commits since last tag)
        id: notes
        if: ${{ steps.release_commits.outputs.has_commits == 'true' }}
        run: |
          prev="${{ steps.get_tag.outputs.tag }}"

          echo "# Release notes for v${{ steps.semver.outputs.new_version }}" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$prev" ]; then
            echo "Changes since ${prev}:" >> release_notes.md
            echo "" >> release_notes.md
          fi
          awk -F '\t' '{printf "- %s (%s) by %s\n", $1, $2, $3}' release_commits.tsv >> release_notes.md

          echo "---"
          cat release_notes.md
          # escape for multi-line output variable
          notes=$(awk '{printf "%s\\n", $0}' release_notes.md)
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Set up Git credentials
        if: ${{ steps.release_commits.outputs.has_commits == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Install uv
        if: ${{ steps.release_commits.outputs.has_commits == 'true' }}
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: 0.12.5
          enable-cache: true

      - name: Update project version and lockfile
        if: ${{ steps.release_commits.outputs.has_commits == 'true' }}
        run: |
          new_version=${{ steps.semver.outputs.new_version }}
          sed -i -E '/^\[project\]/,/^\[.*\]/ s/^version = ".*"/version = "'"$new_version"'"/' pyproject.toml
          uv lock
          uv lock --check
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version to v${new_version} [skip ci]" || echo "No changes to commit"

      - name: Create Annotated Tag with Release Notes
        if: ${{ steps.release_commits.outputs.has_commits == 'true' }}
        run: |
          new_tag="v${{ steps.semver.outputs.new_version }}"
          # annotated tag (-a) with message including release notes
          # use a heredoc to preserve newlines
          {
            echo "Release ${new_tag}"
            echo
            cat release_notes.md
          } > TAG_MSG.txt

          # Recreate tag if it already exists locally to avoid failures
          git tag -d "$new_tag" 2>/dev/null || true
          git tag -a "$new_tag" -F TAG_MSG.txt

      - name: Push Main and Tag
        if: ${{ steps.release_commits.outputs.has_commits == 'true' }}
        run: |
          git push origin main
          git push origin "v${{ steps.semver.outputs.new_version }}"

      - name: Create GitHub Release (with notes)
        if: ${{ steps.release_commits.outputs.has_commits == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_tag="v${{ steps.semver.outputs.new_version }}"
          # If release exists, update; else create
          if gh release view "$new_tag" >/dev/null 2>&1; then
            gh release edit "$new_tag" --notes-file release_notes.md
          else
            gh release create "$new_tag" --title "$new_tag" --notes-file release_notes.md
          fi

      - name: Skip Release
        if: ${{ steps.release_commits.outputs.has_commits != 'true' }}
        run: echo "No releaseable commits found since the latest tag."
